name = "PAdicOrderType"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PAdicOrderType", "Challenge", "TargetsCheck"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[require]]
name = "TrustworthyKedlaya"
git = "https://github.com/YijunYuan/TrustworthyKedlaya.git"
rev = "f97be4372713e25a21603dec26706d8bb0cd9d24"

[[lean_lib]]
name = "PAdicOrderType"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "TargetsCheck"
